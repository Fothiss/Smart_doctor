[project]
name = "smart-doctor-backend"
version = "0.1.0"
description = "Smart Doctor API: проверка врачебных протоколов на соответствие клиническим рекомендациям"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Комментарии и докстринги на русском: RUF001-003 считают кириллицу неоднозначной
ignore = ["RUF001", "RUF002", "RUF003"]
