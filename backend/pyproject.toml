[project]
name = "smart-doctor-backend"
version = "0.1.0"
description = "Smart Doctor API: проверка врачебных протоколов на соответствие клиническим рекомендациям"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.4",
    "langchain-gigachat>=0.5.1",
    "pdfplumber>=0.11.10",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# CPU-сборка нужна контейнеру: GPU в образе нет, а CUDA-колёса весят гигабайты
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Локально считаем на видеокарте: на CPU эмбеддинг 220 страниц идёт ~25 минут,
# на GTX 1650 — 2.4 минуты (замер: 341 мс на чанк против 3.5 с).
torch = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Комментарии и докстринги на русском: RUF001-003 считают кириллицу неоднозначной
ignore = ["RUF001", "RUF002", "RUF003"]
