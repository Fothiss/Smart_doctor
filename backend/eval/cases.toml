# Эталонный набор чата: переписывание запроса (L1) и извлечение фрагментов (L2).
#
# Кейс состоит из вопроса, необязательной истории и двух ожиданий:
#   expect_expression — условия, которые обязаны попасть в поисковый запрос;
#   expect_chunk_ids  — фрагменты, хотя бы один из которых должен попасть в выдачу.
# Кейсы kind = "outside" ожидаемых фрагментов не имеют: тема проверяется на отсутствие
# в клинреке полем keywords и в счёт пройденных не входит.
#
# Ожидаемое условие обязано встречаться и во входе кейса (вопрос/история), и в тексте
# ожидаемого фрагмента — с точностью до регистра, «ё», тире и кавычек. Иначе кейс
# невыполним: переписывание не добавляет условий, которых врач не называл. Проверку
# делает `run.py --check`.

guideline_id = "7a5ac995-256a-40c0-ae04-fdb50d421152"
title = "Гипертензия, КР 62/3"

# --- Одиночные вопросы: проверяют извлечение фрагментов -----------------------

[[cases]]
id = "bp-first-target"
question = "до какого уровня снижать артериальное давление пациентам с гипертензией, получающим лечение?"
expect_expression = ["лечен"]
expect_chunk_ids = ["b555e9d3-3d68-586f-a389-56076a9699aa"]

[[cases]]
id = "bp-elderly-isah"
question = "до каких цифр снижать систолическое давление пациенту 80 лет с изолированной систолической гипертензией?"
expect_expression = ["80 лет", "систолическ"]
expect_chunk_ids = ["feb9d4dc-8714-5fa2-b3cb-6348bccc5cec", "69754e1d-ded1-50d8-94b7-c805943200c8"]

[[cases]]
id = "drug-classes-five"
question = "какие 5 классов препаратов составляют основу антигипертензивной терапии?"
expect_expression = ["5 классов"]
expect_chunk_ids = ["0e5b4033-239e-5312-b497-0abc86cffd5f"]

[[cases]]
id = "combination-two-drugs"
question = "достаточно ли одному пациенту одного препарата или большинству нужна комбинация двух препаратов?"
expect_expression = ["двух препаратов"]
expect_chunk_ids = ["551fe66a-f703-5799-8ae6-25054cb0f046", "889b8fa2-98fe-5283-88db-67a16d5de62b"]

[[cases]]
id = "acei-hyperkalemia"
question = "можно ли назначать иАПФ и БРА при калии 5,5 ммоль/л?"
expect_expression = ["иапф", "5,5"]
expect_chunk_ids = ["5fcae8b9-2df6-555e-ade8-acb106eee39f"]

[[cases]]
id = "ckd-start-level"
question = "с какого уровня давления начинать лечение при ХБП?"
expect_expression = ["хбп|хроническая болезнь почек"]
expect_chunk_ids = ["1685e556-d678-5632-8e93-8cc27e36ad1c"]

[[cases]]
id = "resistant-definition"
question = "когда артериальную гипертензию считают резистентной к лечению?"
expect_expression = ["резистентн"]
expect_chunk_ids = ["fd6df181-2358-5a70-af3f-b39c44a454cf", "5de2c1d7-ee96-5628-acad-1bcd83ebe2bd"]

[[cases]]
id = "crisis-rate"
question = "на сколько процентов можно снизить давление за первые 2 часа при гипертоническом кризе?"
expect_expression = ["криз", "2 часа"]
expect_chunk_ids = ["b78a4cf3-4cbb-527a-8c48-b072924930ea", "016d1bb0-1c24-511b-bdca-c87206fa1af8"]

